<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#fff"/><rect x="24" y="22" width="852" height="516" rx="18" fill="#f6fbfa" stroke="#0f766e" stroke-width="3"/><text x="50" y="70" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Fisika • Gerak Lengkung • Seri 2</text><rect x="70" y="115" width="760" height="55" rx="8" transform="translate(0 0)" fill="#e9f5f2" stroke="#b8d8d2"/><text x="90" y="150" transform="translate(0 0)" font-family="Arial" font-size="16" fill="#17324d">Proyektil T1 ditembakkan miring tanpa hambatan udara dan sedang berada di titik tertin</text><rect x="70" y="115" width="760" height="55" rx="8" transform="translate(0 68)" fill="#ffffff" stroke="#b8d8d2"/><text x="90" y="150" transform="translate(0 68)" font-family="Arial" font-size="16" fill="#17324d">Pilih semua pernyataan yang benar.</text><rect x="70" y="115" width="760" height="55" rx="8" transform="translate(0 136)" fill="#e9f5f2" stroke="#b8d8d2"/><text x="90" y="150" transform="translate(0 136)" font-family="Arial" font-size="16" fill="#17324d">Komponen kecepatan vertikal nol, tetapi percepatan tetap g ke bawah.</text><rect x="70" y="115" width="760" height="55" rx="8" transform="translate(0 204)" fill="#ffffff" stroke="#b8d8d2"/><text x="90" y="150" transform="translate(0 204)" font-family="Arial" font-size="16" fill="#17324d">Di titik tertinggi vᵧ=0, sedangkan vₓ tetap dan percepatan gravitasi tetap ke bawah.</text><text x="50" y="520" font-family="Arial" font-size="14" fill="#667085">Visual orisinal bank soal TKA Fisika</text><text x="830" y="520" text-anchor="end" font-family="Arial" font-size="14" fill="#667085">FIS-AST-0157</text></svg>