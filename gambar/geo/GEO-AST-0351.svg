<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#fff"/><rect x="24" y="22" width="852" height="516" rx="18" fill="#f6fbfa" stroke="#0f766e" stroke-width="3"/><text x="50" y="70" font-family="Arial" font-size="23" font-weight="700" fill="#17324d">Geografi • Posisi strategis Indonesia dan pengaruhnya bagi kehidupan ekonomi, sosial, budaya secara nasional maupun internasional • Seri 71</text><rect x="65" y="112" width="770" height="58" rx="9" transform="translate(0 0)" fill="#e9f5f2" stroke="#b8d8d2"/><text x="88" y="148" transform="translate(0 0)" font-family="Arial" font-size="16" fill="#17324d">Letak Indonesia di persilangan Asia-Australia menyebabkan interaksi masyarakat dengan be</text><rect x="65" y="112" width="770" height="58" rx="9" transform="translate(0 70)" fill="#fff" stroke="#b8d8d2"/><text x="88" y="148" transform="translate(0 70)" font-family="Arial" font-size="16" fill="#17324d">Pengaruh sosial-budaya yang paling tepat adalah ...</text><rect x="65" y="112" width="770" height="58" rx="9" transform="translate(0 140)" fill="#e9f5f2" stroke="#b8d8d2"/><text x="88" y="148" transform="translate(0 140)" font-family="Arial" font-size="16" fill="#17324d">Terbentuk keragaman budaya melalui difusi, akulturasi, dan pertukaran antarmasyarakat.</text><rect x="65" y="112" width="770" height="58" rx="9" transform="translate(0 210)" fill="#fff" stroke="#b8d8d2"/><text x="88" y="148" transform="translate(0 210)" font-family="Arial" font-size="16" fill="#17324d">Kontak antarkelompok melalui perdagangan dan migrasi mendorong difusi serta akulturasi, </text><text x="50" y="520" font-family="Arial" font-size="14" fill="#667085">Visual orisinal bank soal TKA Geografi</text><text x="830" y="520" text-anchor="end" font-family="Arial" font-size="14" fill="#667085">GEO-AST-0351</text></svg>