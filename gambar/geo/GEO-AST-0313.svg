<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#fff"/><rect x="24" y="22" width="852" height="516" rx="18" fill="#f6fbfa" stroke="#0f766e" stroke-width="3"/><text x="50" y="70" font-family="Arial" font-size="23" font-weight="700" fill="#17324d">Geografi • Proses/fenomena yang memengaruhi lingkungan fisik • Seri 78</text><rect x="65" y="112" width="770" height="58" rx="9" transform="translate(0 0)" fill="#e9f5f2" stroke="#b8d8d2"/><text x="88" y="148" transform="translate(0 0)" font-family="Arial" font-size="16" fill="#17324d">Angin muson di wilayah N26 berubah arah mengikuti perbedaan tekanan antara Benua Asia da</text><rect x="65" y="112" width="770" height="58" rx="9" transform="translate(0 70)" fill="#fff" stroke="#b8d8d2"/><text x="88" y="148" transform="translate(0 70)" font-family="Arial" font-size="16" fill="#17324d">Pengaruh utama fenomena tersebut bagi Indonesia adalah ...</text><rect x="65" y="112" width="770" height="58" rx="9" transform="translate(0 140)" fill="#e9f5f2" stroke="#b8d8d2"/><text x="88" y="148" transform="translate(0 140)" font-family="Arial" font-size="16" fill="#17324d">Terbentuknya pola musim hujan dan kemarau yang berbeda secara periodik.</text><rect x="65" y="112" width="770" height="58" rx="9" transform="translate(0 210)" fill="#fff" stroke="#b8d8d2"/><text x="88" y="148" transform="translate(0 210)" font-family="Arial" font-size="16" fill="#17324d">Perubahan pusat tekanan musiman mengubah arah angin dan pasokan uap air sehingga membent</text><text x="50" y="520" font-family="Arial" font-size="14" fill="#667085">Visual orisinal bank soal TKA Geografi</text><text x="830" y="520" text-anchor="end" font-family="Arial" font-size="14" fill="#667085">GEO-AST-0313</text></svg>