<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#fff"/><rect x="24" y="22" width="852" height="516" rx="18" fill="#f6fbfa" stroke="#0f766e" stroke-width="3"/><text x="50" y="70" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Biologi • classification • Seri 23</text><rect x="70" y="120" width="760" height="52" rx="10" fill="#e9f5f2" stroke="#b8d8d2"/><text x="90" y="153" font-family="Arial" font-size="16" fill="#17324d">Di kawasan C8 ditemukan 11 varietas padi lokal, 16 spesies burung, serta hutan mangrove </text><rect x="70" y="186" width="760" height="52" rx="10" fill="#ffffff" stroke="#b8d8d2"/><text x="90" y="219" font-family="Arial" font-size="16" fill="#17324d">Data tersebut berturut-turut menunjukkan keanekaragaman tingkat ...</text><rect x="70" y="252" width="760" height="52" rx="10" fill="#e9f5f2" stroke="#b8d8d2"/><text x="90" y="285" font-family="Arial" font-size="16" fill="#17324d">Gen, spesies, dan ekosistem.</text><rect x="70" y="318" width="760" height="52" rx="10" fill="#ffffff" stroke="#b8d8d2"/><text x="90" y="351" font-family="Arial" font-size="16" fill="#17324d">Varietas dalam satu spesies menunjukkan tingkat gen, banyak jenis burung tingkat spesies</text><text x="50" y="520" font-family="Arial" font-size="14" fill="#667085">Aset orisinal bank soal TKA</text><text x="830" y="520" text-anchor="end" font-family="Arial" font-size="14" fill="#667085">BIO-AST-0024</text></svg>